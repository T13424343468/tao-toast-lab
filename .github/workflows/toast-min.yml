name: toast-min
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: probe step
        shell: pwsh
        run: |
          Write-Output "alive"
          $dir = "$env:USERPROFILE\toasttest"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          New-Item -Path 'HKCU:\Software\Classes\AppUserModelId\Win11ToastTest' -Force | Out-Null
          powershell -NoProfile -Command "try{[void][Windows.UI.Notifications.ToastNotificationManager,Windows.UI.Notifications,ContentType=WindowsRuntime];$t=[Windows.UI.Notifications.ToastNotificationManager]::GetTemplateContent([Windows.UI.Notifications.ToastTemplateType]::ToastText02);$x=$t.GetElementsByTagName('text');[void]$x.Item(0).AppendChild($t.CreateTextNode('MinProbe'));[Windows.UI.Notifications.ToastNotificationManager]::CreateToastNotifier('Win11ToastTest').Show([Windows.UI.Notifications.ToastNotification]::new($t));Write-Output 'TOAST-OK'}catch{Write-Output ('TOAST-FAIL: ' + $_.Exception.Message)}"
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          Write-Output ("screen " + $b.Width + "x" + $b.Height)
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.X, $b.Y, 0, 0, $bmp.Size)
          $bmp.Save("$dir\probe.png")
          Write-Output "shot saved"
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe
          path: |
            **/toasttest/*.png
